name: Refresh Strategy Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/build_static_news.py'
      - 'scripts/augment_strategy_radar.py'
      - 'config/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

concurrency:
  group: strategy-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install feedparser PyYAML beautifulsoup4
      - name: Collect Russian market intelligence
        run: python scripts/build_static_news.py
      - name: Add official and global sources
        run: python scripts/augment_strategy_radar.py
      - name: Publish refreshed data
        run: |
          mkdir -p docs/data
          cp data/news.json docs/data/news.json
      - name: Save refreshed archive
        run: |
          git config user.name "strategy-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json docs/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Strategy Radar"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
