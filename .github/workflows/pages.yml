name: Update intelligence and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_static_news.py'
      - 'config/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install feed dependencies
        run: pip install feedparser PyYAML
      - name: Collect and analyze news
        run: python scripts/build_static_news.py
      - name: Persist updated archive
        run: |
          git config user.name "strategic-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh strategic intelligence"
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir -p site/data
          cp data/news.json site/data/news.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
