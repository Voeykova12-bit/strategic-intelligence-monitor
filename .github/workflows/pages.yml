name: Refresh strategic intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_static_news.py'
      - 'config/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

concurrency:
  group: strategic-intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install feedparser PyYAML beautifulsoup4
      - name: Collect and filter strategic intelligence
        run: python scripts/build_static_news.py
      - name: Update website data
        run: |
          mkdir -p docs/data
          cp data/news.json docs/data/news.json
      - name: Save refreshed archive
        run: |
          git config user.name "strategic-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json docs/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh strategic intelligence"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
